[package]
name = "liaisonyy-client"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "liaisonyy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liaisonyy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
liaisonyy-core = { path = "../../crates/core" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
