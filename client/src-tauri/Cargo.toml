[package]
name = "liaisonyy-client"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "liaisonyy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liaisonyy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
liaisonyy-core = { path = "../../crates/core" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
