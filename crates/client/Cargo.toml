[package]
name = "liaisonyy-client"
version.workspace = true
edition.workspace = true

[dependencies]
liaisonyy-core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tray-icon = "0.19"
muda = "0.15"
