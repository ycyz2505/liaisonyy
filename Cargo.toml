[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/update-sign", "client/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
