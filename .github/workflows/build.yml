name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_update:
        description: "Publish client + server update assets to GitHub Releases"
        required: false
        default: false
        type: boolean
      version:
        description: "Version, e.g. 0.3.2 (required when publish_update)"
        required: false
        type: string
      min_client:
        description: "Minimum client version for forced update"
        required: false
        default: "0.3.0"
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use crates.io on CI
        shell: bash
        run: |
          if [ -f .cargo/config.toml ]; then
            sed -i '/replace-with = "rsproxy-sparse"/d' .cargo/config.toml
            sed -i '/\[source.rsproxy-sparse\]/,+1d' .cargo/config.toml
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install NASM (ring)
        run: choco install nasm -y --no-progress
      - name: End-to-end test
        run: cargo test -p liaisonyy-server --test e2e -- --nocapture

  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use crates.io on CI
        shell: bash
        run: |
          if [ -f .cargo/config.toml ]; then
            sed -i '/replace-with = "rsproxy-sparse"/d' .cargo/config.toml
            sed -i '/\[source.rsproxy-sparse\]/,+1d' .cargo/config.toml
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install NASM (ring)
        run: choco install nasm -y --no-progress
      - name: Install frontend deps
        working-directory: client
        run: npm ci
      - name: Build Tauri client
        working-directory: client
        run: npm run build:tauri
      - name: Collect client artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = Get-ChildItem -Path target -Recurse -Filter "liaisonyy-client.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\release\\' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path target -Recurse -Filter "liaisonyy.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\release\\' } | Select-Object -First 1 }
          if (-not $exe) { throw "client exe not found" }
          Copy-Item $exe.FullName artifact/liaisonyy.exe
          $dll = Get-ChildItem -Path target -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll not found" }
          Copy-Item $dll.FullName artifact/
          Get-ChildItem artifact | Format-Table Name, Length
      - name: Check client dependencies
        shell: pwsh
        run: |
          if (Test-Path artifact/liaisonyy.exe) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && dumpbin /dependents artifact\liaisonyy.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: liaisonyy-client-windows
          path: artifact/*
          if-no-files-found: error

  server-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use crates.io on CI
        shell: bash
        run: |
          if [ -f .cargo/config.toml ]; then
            sed -i '/replace-with = "rsproxy-sparse"/d' .cargo/config.toml
            sed -i '/\[source.rsproxy-sparse\]/,+1d' .cargo/config.toml
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install NASM (ring)
        run: choco install nasm -y --no-progress
      - name: Build server
        run: cargo build --release -p liaisonyy-server --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: liaisonyy-server-windows
          path: target/x86_64-pc-windows-msvc/release/liaisonyy-server.exe
          if-no-files-found: error

  publish-update:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_update) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, client, server-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: liaisonyy-client-windows
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: liaisonyy-server-windows
          path: artifact-server-windows
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          fi
          if [[ -z "$VERSION" ]]; then
            echo "version is required" >&2
            exit 1
          fi
          MIN="${{ inputs.min_client }}"
          if [[ -z "$MIN" ]]; then MIN="0.3.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "min=$MIN" >> "$GITHUB_OUTPUT"
      - name: Build manifest
        shell: bash
        run: |
          set -e
          mkdir -p release
          cp artifact/liaisonyy.exe release/liaisonyy.exe
          cp artifact/WebView2Loader.dll release/WebView2Loader.dll
          cp artifact-server-windows/liaisonyy-server.exe release/liaisonyy-server.exe
          CLIENT_SHA=$(openssl dgst -sha256 -binary release/liaisonyy.exe | base64 -w0)
          CLIENT_SIZE=$(stat -c%s release/liaisonyy.exe)
          WIN_SHA=$(openssl dgst -sha256 -binary release/liaisonyy-server.exe | base64 -w0)
          WIN_SIZE=$(stat -c%s release/liaisonyy-server.exe)
          BASE="https://github.com/ycyz2505/liaisonyy/releases/download/v${{ steps.ver.outputs.version }}"
          cat > release/manifest.json <<EOF
          {
            "schema": 1,
            "version": "${{ steps.ver.outputs.version }}",
            "min_client": "${{ steps.ver.outputs.min }}",
            "files": {
              "windows": {
                "url": "$BASE/liaisonyy.exe",
                "sha256": "$CLIENT_SHA",
                "size": $CLIENT_SIZE
              }
            },
            "server": {
              "windows": {
                "url": "$BASE/liaisonyy-server.exe",
                "sha256": "$WIN_SHA",
                "size": $WIN_SIZE
              }
            }
          }
          EOF
          cat release/manifest.json
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="v${{ steps.ver.outputs.version }}"
          ASSETS="release/liaisonyy.exe release/WebView2Loader.dll release/manifest.json release/liaisonyy-server.exe"
          if gh release view "$TAG" --repo ycyz2505/liaisonyy >/dev/null 2>&1; then
            if [[ "${GITHUB_REF}" == refs/tags/v* || "${{ inputs.publish_update }}" == "true" ]]; then
              gh release upload "$TAG" $ASSETS --repo ycyz2505/liaisonyy --clobber
            else
              echo "release $TAG already exists; auto-publish skipped"
            fi
          else
            ARGS=(release create "$TAG" $ASSETS --repo ycyz2505/liaisonyy \
              --title "liaisonyy ${{ steps.ver.outputs.version }}" \
              --notes "liaisonyy ${{ steps.ver.outputs.version }}")
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              ARGS+=(--target "$GITHUB_SHA")
            fi
            gh "${ARGS[@]}"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client, server-windows, publish-update]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          overwrite_files: true
