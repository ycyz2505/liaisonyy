<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>liaisonyy 管理后台</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#e3e7ec; --text:#1f2937; --muted:#6b7280; --accent:#0f766e; --danger:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 "Microsoft YaHei UI","Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  main { max-width:1100px; margin:22px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .grow { flex:1; min-width:240px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, textarea, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:110px; resize:vertical; }
  button { border:0; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer; background:var(--accent); color:#fff; }
  button.secondary { background:#e5e7eb; color:#111827; }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat b { display:block; font-size:24px; color:var(--accent); }
  .stat span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .muted { color:var(--muted); }
  .hidden { display:none; }
  .err { color:var(--danger); min-height:20px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#ecfdf5; color:#047857; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>liaisonyy 管理后台</h1>
  <div id="who" class="muted" style="color:#d1fae5"></div>
</header>
<main>
  <section id="loginCard" class="card">
    <h2 style="margin-top:0">管理员登录</h2>
    <p class="muted">总管理员或班级管理员账号；PIN 不能用于管理后台。</p>
    <div class="row">
      <div class="grow"><label>UID 或 YY 号</label><input id="handle" autocomplete="username"></div>
      <div class="grow"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div>
    </div>
    <div style="margin-top:12px"><button id="loginBtn">登录</button></div>
    <div id="loginErr" class="err"></div>
  </section>

  <section id="panel" class="hidden">
    <div class="card">
      <div class="row" style="align-items:center">
        <h2 style="margin:0" class="grow">概览</h2>
        <button class="secondary" id="refreshBtn">刷新</button>
        <button class="secondary" id="logoutBtn">退出</button>
      </div>
      <div id="stats" class="stats" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">班级与名单</h2>
      <p class="muted">班级创建需要客户端生成班级托管密钥；这里可以查看班级、导入名单（每行一个姓名）。</p>
      <div id="classes"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">审计日志</h2>
      <div id="audit"></div>
    </div>
  </section>
</main>
<script>
let token = sessionStorage.getItem('liaisonyy_admin_token') || '';
let me = null;

function q(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(ts){ if(!ts) return ''; const d = new Date(ts*1000); return d.toLocaleString('zh-CN'); }

async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((body && body.message) || ('HTTP ' + res.status));
  return body;
}

async function login() {
  q('loginErr').textContent = '';
  try {
    const body = await api('/api/v1/auth/login', {method:'POST', body: JSON.stringify({
      uid_or_handle: q('handle').value.trim(),
      kind: 'password',
      input: q('password').value
    })});
    if (body.role !== 'root' && body.role !== 'class_admin') throw new Error('该账号不是管理员');
    token = body.token;
    sessionStorage.setItem('liaisonyy_admin_token', token);
    me = body;
    q('password').value = '';
    showPanel();
    await refreshAll();
  } catch (e) { q('loginErr').textContent = e.message; }
}

function showPanel() {
  q('loginCard').classList.add('hidden');
  q('panel').classList.remove('hidden');
  q('who').textContent = (me ? (me.display_name + ' · ' + (me.role === 'root' ? '总管理员' : '班级管理员')) : '');
}

async function refreshStats() {
  try {
    const s = await api('/api/v1/admin/stats');
    q('stats').innerHTML = [
      ['账号数', s.users], ['在线', s.online], ['今日消息', s.messages_today],
      ['消息总数', s.messages_total], ['班级数', s.classes], ['待处理申请', s.pending_requests],
      ['数据库', (s.db_bytes/1024/1024).toFixed(1) + ' MB']
    ].map(([k,v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
  } catch (e) { q('stats').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

async function refreshClasses() {
  try {
    const classes = await api('/api/v1/admin/classes');
    if (!classes.length) { q('classes').innerHTML = '<p class="muted">还没有班级。请在客户端「管理」页创建班级（需要生成班级托管密钥）。</p>'; return; }
    q('classes').innerHTML = classes.map(c => `
      <div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0">
        <div class="row" style="align-items:center">
          <div class="grow"><b>${esc(c.name)}</b> <span class="muted">${esc(c.grade || '')} · ${c.unclaimed} 人未注册</span></div>
          <button class="secondary" data-class="${c.id}" data-action="toggle">导入名单</button>
        </div>
        <div class="hidden" id="import-${c.id}" style="margin-top:10px">
          <textarea id="names-${c.id}" placeholder="每行一个姓名"></textarea>
          <div style="margin-top:8px"><button data-class="${c.id}" data-action="import">导入</button></div>
        </div>
      </div>`).join('');
    q('classes').querySelectorAll('button').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute('data-class');
        if (btn.getAttribute('data-action') === 'toggle') {
          q('import-' + id).classList.toggle('hidden');
        } else {
          const names = q('names-' + id).value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
          if (!names.length) return;
          try {
            const r = await api('/api/v1/admin/classes/' + id + '/roster', {method:'POST', body: JSON.stringify({names})});
            alert('已导入 ' + r.imported + ' 人');
            await refreshClasses();
          } catch (e) { alert(e.message); }
        }
      };
    });
  } catch (e) { q('classes').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

async function refreshAudit() {
  try {
    const rows = await api('/api/v1/admin/audit');
    if (!rows.length) { q('audit').innerHTML = '<p class="muted">暂无记录。</p>'; return; }
    q('audit').innerHTML = '<table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>目标</th><th>详情</th></tr></thead><tbody>' +
      rows.map(r => `<tr><td>${esc(fmt(r.ts))}</td><td>${esc(r.actor_uid || '')}</td><td><span class="pill">${esc(r.action)}</span></td><td>${esc((r.target_type||'') + ' ' + (r.target_id||''))}</td><td>${esc(r.detail||'')}</td></tr>`).join('') +
      '</tbody></table>';
  } catch (e) { q('audit').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

async function refreshAll() { await refreshStats(); await refreshClasses(); await refreshAudit(); }

q('loginBtn').onclick = login;
q('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
q('refreshBtn').onclick = refreshAll;
q('logoutBtn').onclick = async () => {
  try { await api('/api/v1/auth/logout', {method:'POST'}); } catch (e) {}
  token = ''; sessionStorage.removeItem('liaisonyy_admin_token'); me = null;
  q('panel').classList.add('hidden'); q('loginCard').classList.remove('hidden'); q('who').textContent = '';
};
if (token) { showPanel(); refreshAll().catch(() => {}); }
</script>
</body>
</html>
